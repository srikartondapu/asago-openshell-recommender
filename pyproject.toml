[project]
name = "asago-openshell-recommender"
version = "0.1.0"
description = "Prototype OpenShell sandbox-policy recommender for ASAGO"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
asago-openshell-recommender = "openshell_recommender.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openshell_recommender"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
