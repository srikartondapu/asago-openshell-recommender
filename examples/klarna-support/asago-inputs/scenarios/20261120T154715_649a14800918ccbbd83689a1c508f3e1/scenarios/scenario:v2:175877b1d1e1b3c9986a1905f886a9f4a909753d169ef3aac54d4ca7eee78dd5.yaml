      outcome_link_pc_ids:
      - post.execute.injection
      postcondition_ids:
      - post.execute.injection
  - step_number: 4
    zone: memory
    action: The agent writes the fraudulent directive into its persistent memory folder,
      ensuring the instruction survives the current session.
    effect: The agent's long-term context is now poisoned with unauthorized financial
      instructions. In a subsequent session, the attacker returns to trigger the payload.
    control_point: null
