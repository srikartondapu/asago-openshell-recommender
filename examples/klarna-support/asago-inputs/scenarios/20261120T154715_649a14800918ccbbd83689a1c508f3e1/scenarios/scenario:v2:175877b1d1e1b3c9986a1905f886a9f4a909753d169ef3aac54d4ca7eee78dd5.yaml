      outcome_link_pc_ids:
      - post.deliver.payload
      postcondition_ids:
      - post.deliver.payload
  - step_number: 3
    zone: reasoning
    action: The agent's reasoning engine evaluates the prompt and, following the attacker's
      deceptive instructions, determines that the directive should be treated as a
      permanent operational rule.
    effect: The agent prepares to commit the poisoned instruction to its long-term
      state. The agent proceeds to update its persistent storage.
    control_point: null
    projected_step_ids:
