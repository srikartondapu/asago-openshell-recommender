narrative:
  title: Poisoning persistent memory to trigger unauthorized refund processing
  summary: An advanced adversarial user exploits the Klarna AI Assistant's persistent
    memory capabilities by injecting deceptive operational directives through a standard
    chat session. By instructing the agent to record specific, fraudulent instructions
    in its long-term memory, the attacker ensures that in a subsequent, unrelated
    session, the agent's reasoning engine will retrieve these poisoned notes and autonomously
    invoke the refund processing API for unauthorized amounts, effectively bypassing
    session-level intent validation.
  entry_point: user prompts via Klarna app and web flow
  zone_sequence:
  - outside
  - input
  - reasoning
  - memory
  - tool_execution
  steps:
  - step_number: 1
    zone: outside
    action: The attacker identifies the agent's ability to maintain persistent notes
      in a memory folder and prepares a sophisticated prompt designed to masquerade
      as a legitimate operational update.
    effect: The groundwork is laid for a cross-session injection attack. Having prepared
      the payload, the attacker initiates a new conversation.
    control_point: null
    projected_step_ids:
    - craft_payload
    - conceal_injection
