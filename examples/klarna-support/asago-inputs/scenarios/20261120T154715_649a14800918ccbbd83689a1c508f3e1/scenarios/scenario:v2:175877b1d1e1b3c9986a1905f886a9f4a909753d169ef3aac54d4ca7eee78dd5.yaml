  - step_number: 2
    zone: input
    action: The attacker delivers the malicious prompt via the Klarna app interface,
      commanding the agent to save a directive stating that all future refund requests
      for specific high-value merchant IDs must be processed immediately without further
      verification.
    effect: The deceptive instruction enters the system's input surface. The agent
      processes the input and begins its reasoning cycle.
    control_point: null
    projected_step_ids:
