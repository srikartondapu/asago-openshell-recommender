    - projected_step_id: conceal_injection
      action_kind: prepare
      executor_role: attacker
      boundary_position: outside
      resource_ref_ids: []
      consumed_ref_ids:
      - poisoned_content
      produced_ref_ids:
      - concealed_injection
      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.conceal_injection
  - step_number: 2
    zone: reasoning
    action: When the customer initiates a query, the assistant retrieves the poisoned
      order details, causing the model to process the hidden instructions as legitimate
      operational commands [AML.T0051.001].
    effect: The agent's internal reasoning is hijacked, shifting its goal from general
      customer support to the specific execution of a refund. The redirected reasoning
      leads directly to unauthorized tool use.
    control_point: null
    projected_step_ids:
