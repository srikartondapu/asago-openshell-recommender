# Generated by the OpenShell recommender compiler. manifest=sandbox-manifest-refunds.yaml least privilege from the manifest
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  - /var/log
  - /opt
  read_write:
  - /sandbox/workdir
  - /tmp
  - /dev/null
  - /dev/shm
landlock:
  compatibility: best_effort
process:
  run_as_user: '1500'
  run_as_group: '1500'
network_policies:
  model:
    endpoints:
    - host: host.openshell.internal
      port: 11434
    binaries:
    - path: /opt/app-root/.venv/bin/python-ogx
  http_shipping_status:
    endpoints:
    - host: host.openshell.internal
      port: 9101
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /shipments/*
    binaries:
    - path: /opt/app-root/.venv/bin/python-mcp
