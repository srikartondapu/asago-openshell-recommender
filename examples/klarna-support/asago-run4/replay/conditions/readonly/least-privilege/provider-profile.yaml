# Generated by the OpenShell recommender compiler. manifest=sandbox-manifest-readonly.yaml fragments=all
id: klarna-support-readonly-tools-token
display_name: klarna-support readonly tool token
description: Bearer token for the agent's MCP tool server (generated by the OpenShell
  recommender)
category: other
credentials:
- name: tool_token
  description: MCP tool server bearer token
  env_vars:
  - MIDOJO_TOOL_TOKEN
  required: true
  auth_style: bearer
  header_name: Authorization
endpoints:
- host: host.openshell.internal
  port: 8765
  path: /mcp
  protocol: mcp
  enforcement: enforce
  mcp:
    allow_all_known_mcp_methods: true
  rules:
  - allow:
      method: tools/list
  - allow:
      method: tools/call
      tool:
        any:
        - lookup_order
        - get_account_details
        - retrieve_policy
        - escalate_to_human
binaries:
- /opt/app-root/.venv/bin/python-ogx
