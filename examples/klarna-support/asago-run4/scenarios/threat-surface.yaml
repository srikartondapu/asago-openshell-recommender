- risk_card:
    risk_id: atlas-nonconsensual-use
    risk_name: Nonconsensual use
    risk_description: Generative AI models might be intentionally used to imitate
      people through deepfakes by using video, images, audio, or other modalities
      without their consent.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Intentional imitation of individuals through the creation of deepfake
      video, images, or audio using generative AI services.
    threat_source: Malicious actors or employees utilizing generative AI systems to
      mimic existing communications.
    vulnerability: The ability of generative AI to produce convincing deepfakes and
      the potential for queries or inputs to become public.
    consequence: The generation of highly convincing, nonconsensual synthetic media
      that mimics real people.
    impact: Increased cyber crime through personalized phishing and the potential
      compromise of intellectual property or compliance standards.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-exposing-personal-information
    risk_name: Exposing personal information
    risk_description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI services, such as OpenAI CoPilot or BloombergGPT, may output
      PII or SPI that was inadvertently included in training, fine-tuning, or prompt
      data.
    threat_source: The use of generative AI services by employees using corporate-related
      data or prompts.
    vulnerability: The inclusion of sensitive personal information within the model's
      training datasets, fine-tuning sets, or user-provided prompts.
    consequence: The direct leakage of personal identifiable information (PII) or
      sensitive personal information (SPI) through the model's generated output.
    impact: Potential privacy violations and data breaches affecting individuals and
      the organization's compliance with data protection standards.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-revealing-confidential-information
    risk_name: Revealing confidential information
    risk_description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may inadvertently input or expose confidential corporate data
      into generative AI services through unauthorized access via corporate devices
      or servers.
    threat_source: Employees using generative AI services on corporate infrastructure
      or with corporate identities.
    vulnerability: The lack of technical controls preventing the use of generative
      AI services on corporate devices and the use of corporate identities for these
      systems.
    consequence: Confidential information becomes part of the model's training, fine-tuning,
      or prompt history, leading to data leakage in generated outputs.
    impact: The unauthorized disclosure of sensitive corporate information, potentially
      compromising intellectual property or organizational security.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-dangerous-use
    risk_name: Dangerous use
    risk_description: Generative AI models might be used with the sole intention of
      harming people.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Employees may use generative AI to generate content, such as employee
      appraisals, with the intent to cause professional harm or facilitate unfair
      labor practices.
    threat_source: Employees acting with malicious intent or using AI to bypass human
      accountability in sensitive processes.
    vulnerability: The lack of human authorship in critical documents like HR appraisals
      and the potential for employees to use AI to stand for activities they did not
      personally undertake.
    consequence: The generation of non-human authored documents that can be legally
      challenged or result in upheld employee grievances.
    impact: Organizational instability, legal liability regarding labor disputes,
      and the erosion of trust in internal management processes.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-confidential-information-in-data
    risk_name: Confidential information in data
    risk_description: Confidential information might be included as part of the data
      that is used to train or tune the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Confidential corporate information may be ingested into generative AI
      models during training or tuning processes.
    threat_source: Employees using generative AI services on corporate devices or
      servers.
    vulnerability: The use of corporate devices and identities to access unauthorized
      generative AI systems.
    consequence: Sensitive data becomes part of the model's training set or fine-tuning
      data.
    impact: Potential leakage of proprietary information and loss of control over
      corporate data assets.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
