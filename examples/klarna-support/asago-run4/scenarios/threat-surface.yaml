- risk_card:
    risk_id: atlas-hallucination
    risk_name: Hallucination
    risk_description: Hallucinations generate factually inaccurate or untruthful content
      relative to the model's training data or input. Hallucinations are also sometimes
      referred to lack of faithfulness or lack of groundedness. In some instances,
      synthetic data that is generated by large language models might include hallucinations
      that result in the data possibly being inaccurate, fabricated, or disconnected
      from reality. Hallucinations can compromise model performance, accuracy, and
      relevance.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI systems may produce factually inaccurate, fabricated, or
      ungrounded content, particularly when responding to fact-based queries.
    threat_source: The imperfect accuracy of generative AI systems and the inherent
      tendency of large language models to generate hallucinations.
    vulnerability: The potential for employees to fail to manually verify or check
      the accuracy and completeness of the AI-generated output.
    consequence: The use of inaccurate output that leads to fraudulent, destructive,
      inappropriate system usage, or non-compliance with regulations and copyright
      protections.
    impact: The realization of poor, biased, or unethical business practices and decisions,
      resulting in reputational or financial harm to the company.
