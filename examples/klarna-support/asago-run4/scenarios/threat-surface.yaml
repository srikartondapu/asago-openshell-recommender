    risk_name: Incomplete usage definition
    risk_description: Since foundation models can be used for many purposes, a model's
      intended use is important for defining the relevant risks of that model. As
      the use changes, the relevant risks might correspondingly change.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: The intended purpose and scope of external generative AI services may
      be poorly defined or evolve without updated oversight.
    threat_source: The rapid development and integration of generative AI across all
      levels of a financial firm.
    vulnerability: The lack of specific, updated definitions regarding the acceptable
      use of foundation models as their applications change.
