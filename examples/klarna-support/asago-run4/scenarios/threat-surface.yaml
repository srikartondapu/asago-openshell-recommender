- risk_card:
    risk_id: atlas-personal-information-in-data
    risk_name: Personal information in data
    risk_description: Inclusion or presence of personal identifiable information (PII)
      and sensitive personal information (SPI) in the data used for training or fine
      tuning the model might result in unwanted disclosure of that information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Employees may include PII, NPI, or sensitive personal information within
      the queries or inputs provided to approved external generative AI systems.
    threat_source: Employees using corporate devices or identities to interact with
      third-party generative AI systems.
    vulnerability: The potential for queries to become public and the lack of automated
      controls to prevent the input of sensitive data into external models.
    consequence: The unwanted disclosure of personal identifiable information or sensitive
      personal information through the generative AI system's training or fine-tuning
      processes.
    impact: Breach of compliance with laws and regulations, and the compromise of
      individual privacy and firm-related confidentiality.
  owasp_llm_ids:
