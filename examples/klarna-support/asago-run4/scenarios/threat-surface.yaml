    risk_id: atlas-ip-information-in-prompt
    risk_name: IP information in prompt
    risk_description: Copyrighted information or other intellectual property might
      be included as a part of the prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Copyrighted information or other intellectual property may be included
      as part of the prompt sent to the generative AI model.
    threat_source: Employees providing queries or code snippets to generative AI systems.
    vulnerability: The lack of genericization in user inputs, such as failing to remove
      references to IP or failing to genericize variable names in shared code.
    consequence: The firm may be liable for violations of external systems' terms
      of use, such as failing to provide required attribution for open-source software
      (OSS) code.
    impact: Potential compromise of the firm's external reputation and legal non-compliance
      with applicable open-source licenses.
