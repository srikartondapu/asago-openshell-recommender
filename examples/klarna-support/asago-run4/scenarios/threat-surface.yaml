- risk_card:
    risk_id: atlas-model-usage-rights
    risk_name: Model usage rights restrictions
    risk_description: Terms of service, licenses, or other rules restrict the use
      of certain models.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Employees may utilize generative AI systems in ways that violate specific
      terms of use, such as failing to provide required attribution or ignoring copyright
      limitations.
    threat_source: Employees accessing external generative AI services via API, UI,
      or other interfaces on corporate or personal devices.
    vulnerability: A lack of established baselines for proper use and insufficient
      employee education regarding the specific legal and licensing obligations of
      third-party AI providers.
    consequence: The company fails to comply with the terms of use of generative AI
      systems, potentially leading to legal disputes over copyright or attribution.
    impact: The firm faces legal and regulatory non-compliance, potential loss of
      intellectual property protections, and damage to the trust and reputation essential
      to the financial services industry.
