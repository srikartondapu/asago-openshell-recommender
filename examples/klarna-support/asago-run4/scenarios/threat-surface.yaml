- risk_card:
    risk_id: atlas-generated-content-ownership
    risk_name: Generated content ownership and IP
    risk_description: Legal uncertainty about the ownership and intellectual property
      rights of AI-generated content.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Users may fail to provide required attribution for AI-generated content
      or inadvertently incorporate code derived from unapproved open-source software
      (OSS) licenses into firm products.
    threat_source: Employees utilizing commercial generative AI tools like GitHub
      CoPilot, Stable Diffusion, or DALL-E for professional tasks.
    vulnerability: The inability of current detection tools to reliably distinguish
      between original employee work and AI-generated output, combined with the legal
      reality that AI output cannot typically be treated as proprietary IP.
    consequence: The firm may face legal liability for violating external Terms of
      Use or failing to honor specific open-source licenses.
    impact: Potential compromise of the firm's external reputation and legal challenges
      regarding the ownership and intellectual property rights of generated assets.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-copyright-infringement
    risk_name: Copyright infringement
    risk_description: A model might generate content that is similar or identical
      to existing work protected by copyright or covered by open-source license agreement.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI systems, such as GitHub CoPilot, BloombergGPT, or image
      generation models like Midjourney, may produce outputs that replicate protected
      works or violate open-source license agreements.
    threat_source: The generative AI systems and their underlying training data containing
      copyrighted or licensed material.
    vulnerability: The imperfect accuracy of generative AI outputs and the potential
      for employees to fail in manually verifying the output for compliance with copyright
      protections and fair use.
    consequence: The use of AI-generated content that violates applicable regulations,
      laws, or acceptable fair use of others' copyright protections.
    impact: Reputational and financial harm to the company resulting from legal non-compliance
      or unethical business practices.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-privacy-rights
    risk_name: Data privacy rights alignment
    risk_description: Applicable laws can establish data subject rights such as opt-out
      rights, right to access, and right to be forgotten. Synthetic data might raise
      unique concerns, such as the potential for reidentification of individuals from
      seemingly anonymous synthetic data. Data subject rights might also be relevant
      in scenarios where synthetic data is derived from sensitive or personal information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Individual data subjects may be re-identified from synthetic data or sensitive
      information processed through external generative AI systems like OpenAI CoPilot
      or Midjourney.
    threat_source: The use of approved external generative AI systems and multimedia
      creation tools by employees across corporate and personal devices.
    vulnerability: The potential for queries and data inputs to become public and
      the inherent risk of data loss when using third-party generative AI interfaces.
    consequence: A violation of data subject rights, such as the right to be forgotten
      or the right to access, specifically regarding sensitive or personal information
      used in AI workflows.
    impact: Non-compliance with applicable laws and regulations, such as GDPR, and
      failure to meet the company's legal and privacy obligations.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
