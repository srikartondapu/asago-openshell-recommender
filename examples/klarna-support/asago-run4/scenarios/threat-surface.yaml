- risk_card:
    risk_id: atlas-improper-retraining
    risk_name: Improper retraining
    risk_description: Using undesirable output (for example, inaccurate, inappropriate,
      and user content) for retraining purposes can result in unexpected model behavior.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: The inclusion of sensitive company queries, proprietary IP, or PII into
      generative AI training sets through the preservation of user queries.
    threat_source: External generative AI systems that use queries for future training
      purposes.
    vulnerability: The lack of data obfuscation or stripping of proprietary, copyrighted,
      or regulated information before inputting it into external AI systems.
    consequence: The model may be retrained on undesirable or sensitive data, potentially
      leading to the public exposure of company strategy or internal IP.
    impact: The company faces significant risks including regulatory or legal action,
      reputational damage, and the potential for reverse engineering of proprietary
      systems.
