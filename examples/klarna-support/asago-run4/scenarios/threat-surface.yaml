- risk_card:
    risk_id: atlas-legal-accountability
    risk_name: Legal accountability
    risk_description: Determining who is responsible for an AI model is challenging
      without good documentation and governance processes. The use of synthetic data
      in model development adds further complexity, since the lack of standardized
      frameworks for recording synthetic data design choices and verification steps
      makes accountability harder to establish.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Difficulty in assigning responsibility for AI-generated content, such
      as an employee appraisal, when the output is used to represent human activity
      or internal documentation.
    threat_source: Employees using generative AI to draft sensitive internal documents
      like HR documents or emails.
    vulnerability: The lack of clear attribution and the ability for users to present
      AI output as their own work, combined with the absence of human authorship in
      critical processes.
    consequence: Legal grievances or complaints being upheld because a human did not
      personally author the document, such as an employee appraisal.
    impact: Legal accountability challenges and potential invalidation of proprietary
      or copyrighted work due to improper attribution or copyright violations.
