    risk_name: Data usage rights restrictions
    risk_description: Terms of service, license compliance, or other IP issues may
      restrict the ability to use certain data for building models.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Users may fail to provide required attribution for generative AI outputs
      or violate terms of service stipulations, such as those found in OpenAI's Terms
      of Use.
    threat_source: The user or the external generative AI system's specific terms
      of use and licensing requirements.
    vulnerability: The user's potential failure to adhere to the onus of correct attribution
      and the inherent legal/ethical complexities in external communications.
    consequence: The invalidation of outputs for proprietary or copyrighted work and
      exposure to copyright violations.
    impact: Legal conflicts with other firms using similar outputs and broader organizational
      risks regarding intellectual property and compliance.
