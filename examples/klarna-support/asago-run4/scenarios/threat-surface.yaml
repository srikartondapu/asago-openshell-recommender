- risk_card:
    risk_id: atlas-spreading-disinformation
    risk_name: Spreading disinformation
    risk_description: Generative AI models might be used to intentionally create misleading
      or false information to deceive or influence a targeted audience.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Employees may use generative AI to create and disseminate misleading or
      false information that lacks proper attribution or violates external terms of
      use.
    threat_source: Employees utilizing generative AI services in violation of corporate
      identity and device restrictions.
    vulnerability: The inability of current detection tools to reliably distinguish
      between original employee work and AI-generated output.
    consequence: The firm may be held liable for violations of commercial AI terms
      of use and failure to provide required attribution.
    impact: The compromise of the firm's external reputation and potential legal or
      licensing conflicts regarding intellectual property and open-source compliance.
