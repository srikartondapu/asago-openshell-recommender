    vulnerability: The inability of current detection tools to reliably distinguish
      between an employee's original work and AI-generated output.
    consequence: The firm may become liable for violations of external systems' terms
      of use and fail to honor applicable open-source licenses.
    impact: The firm's external reputation may be compromised and legal risks may
      arise from improper use of non-proprietary IP or unapproved OSS licenses.
