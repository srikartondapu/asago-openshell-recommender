  - step_number: 2
    zone: input
    action: The attacker delivers the crafted prompt via the Klarna app and web flow,
      instructing the assistant to verify account status and then 'log' the results
      to a specific external URL for 'synchronization'.
    effect: The malicious instructions enter the system's input surface, targeting
      the agent's reasoning engine. The input is passed to the model for processing.
    control_point: null
