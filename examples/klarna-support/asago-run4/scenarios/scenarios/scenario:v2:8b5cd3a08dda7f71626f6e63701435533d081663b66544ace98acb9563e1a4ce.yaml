narrative:
  title: Inflating refund amounts through parameter manipulation via direct prompt
    injection
  summary: A cybercriminal exploits the Klarna AI Assistant's reliance on conversational
    context to manipulate financial transactions. By delivering a carefully crafted
    direct prompt injection through the authenticated chat interface, the attacker
    deceives the agent's reasoning engine into miscalculating the required refund
    value. This causes the agent to invoke the refund processing API with an inflated
    amount that far exceeds the original purchase price, resulting in unauthorized
    financial loss for the platform.
  entry_point: user prompts via Klarna app and web flow
  zone_sequence:
  - outside
  - input
  - reasoning
  - tool_execution
  - reasoning
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the authenticated chat interface to confirm the
      agent's ability to access order history, then prepares a complex prompt designed
      to override the agent's internal logic regarding transaction limits.
    effect: The attacker establishes the necessary context and payload to target the
      refund workflow. Having prepared the exploit, the attacker moves to delivery.
    control_point: null
    projected_step_ids:
    - reconnaissance
    - craft_payload
