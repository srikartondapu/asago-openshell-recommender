      postcondition_ids:
      - post.deliver.payload
  - step_number: 3
    zone: reasoning
    action: The agent's reasoning engine processes the deceptive prompt and incorrectly
      concludes that a massive refund is required to resolve a perceived billing error.
    effect: The model's internal logic is successfully manipulated to generate a malformed
      parameter for the next tool call. The reasoning engine proceeds to execute the
      erroneous instruction.
