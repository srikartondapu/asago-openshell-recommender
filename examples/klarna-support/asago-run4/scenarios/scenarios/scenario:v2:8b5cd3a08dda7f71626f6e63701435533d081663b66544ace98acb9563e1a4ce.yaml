  - step_number: 2
    zone: input
    action: The attacker submits the malicious payload via the Klarna app and web
      flow, using direct prompt injection [AML.T0051.000] to embed deceptive instructions
      within a legitimate-looking refund request.
    effect: The malicious instructions are ingested into the agent's active conversation
      context. The injected instructions trigger the agent's internal processing.
    control_point: null
