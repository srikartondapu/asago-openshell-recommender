  - step_number: 2
    zone: outside
    action: The attacker injects the malicious payload into the merchant's shipping
      API response via the customer purchase and account data store [AML.T0051.001].
    effect: The payload is now positioned to be retrieved by the assistant during
      a legitimate customer inquiry. The attack is primed for execution when a customer
      interacts with the agent.
    control_point: null
    projected_step_ids:
