      postcondition_ids:
      - post.content_ingested
  - step_number: 4
    zone: reasoning
    action: The assistant's reasoning engine processes the injected instructions,
      which command it to present a fake security alert regarding the customer's order.
    effect: The model's logic is hijacked to prioritize the attacker's deceptive narrative
      over standard support protocols. The hijacked reasoning leads to the final deceptive
      output.
