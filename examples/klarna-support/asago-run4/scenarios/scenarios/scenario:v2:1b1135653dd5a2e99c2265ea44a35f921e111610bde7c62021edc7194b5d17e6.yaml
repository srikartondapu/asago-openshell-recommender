faceting:
  risk_card:
    risk_id: atlas-prompt-priming
    risk_name: Prompt priming
    risk_description: Because generative models produce output based on the input
      provided, the model can be prompted to reveal specific kinds of information.
      For example, adding personal information in the prompt increases its likelihood
      of generating similar kinds of personal information in its output. If personal
      data was included as part of the model's training, there is a possibility it
      could be revealed.
    taxonomy: ibm-risk-atlas
    confidence: 0.7761885523796082
    grounding_confidence: medium
    threat: Users may manipulate external generative AI services, such as ChatGPT
      or Bard, by including specific personal information in prompts to elicit the
      disclosure of sensitive data.
    threat_source: The input provided by users to external large language models (LLMs).
    vulnerability: The inherent nature of generative models to produce outputs based
      on the patterns and personal data contained within their training sets and user
      prompts.
    consequence: The model generates and reveals specific kinds of personal information
      or sensitive data in its output.
    impact: The unauthorized exposure of personal data through third-party AI services,
      potentially leading to privacy breaches for the firm and its individuals.
