  - step_number: 3
    zone: reasoning
    action: A customer asks about their order status, prompting the assistant to call
      the shipping status lookup tool, which retrieves the poisoned API response.
    effect: The assistant's reasoning engine ingests the hidden, malicious instructions
      [AML.T0051.001]. The model's internal processing is now compromised.
