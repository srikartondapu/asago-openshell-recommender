      - payload.mass.action
      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.setup
  - step_number: 3
    zone: reasoning
    action: The assistant's reasoning engine parses the deceptive instructions and
      incorrectly identifies the batch refund request as a valid, high-priority customer
      service workflow [AML.T0053].
    effect: The agent's internal logic is subverted, causing it to plan a sequence
      of autonomous tool calls rather than a single response. The agent begins executing
      the planned sequence of financial transactions.
    control_point: null
    projected_step_ids:
    - execution
    realizations:
    - projected_step_id: execution
      action_kind: invoke
      executor_role: attacker
      boundary_position: crossing
