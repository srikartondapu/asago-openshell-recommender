      outcome_link_pc_ids: []
      postcondition_ids:
      - post.craft.payload
  - step_number: 4
    zone: reasoning
    action: The agent's reasoning engine parses the input and, due to the injected
      instructions, prioritizes the adversarial commands over its customer service
      guidelines [AML.T0053]. The reasoning process is successfully diverted to treat
      the shell command as a required task.
    effect: The agent's internal planning is compromised, shifting its goal from financial
      assistance to system manipulation. The hijacked reasoning leads directly to
      tool invocation.
    control_point: null
