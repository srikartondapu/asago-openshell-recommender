      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.reconnaissance
  - step_number: 2
    zone: input
    action: The attacker crafts a sophisticated prompt containing hidden adversarial
      instructions designed to hijack the agent's internal logic via the user prompts
      via Klarna app and web flow.
    effect: The payload is positioned to be ingested as a standard customer query,
      crossing the boundary into the system's input surface. The malicious input is
      then transmitted to the assistant.
    control_point: null
    projected_step_ids:
    - gain_access
    realizations:
