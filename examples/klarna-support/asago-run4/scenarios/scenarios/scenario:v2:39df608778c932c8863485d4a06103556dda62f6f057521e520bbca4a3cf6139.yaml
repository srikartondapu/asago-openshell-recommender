  - step_number: 3
    zone: outside
    action: The attacker submits the crafted prompt through the authenticated chat
      interface.
    effect: The system accepts the input as a valid user request, moving the attack
      from the external interface into the internal processing pipeline. The agent
      begins to process the deceptive instructions.
    control_point: null
    projected_step_ids:
    - craft_payload
    realizations:
    - projected_step_id: craft_payload
      action_kind: prepare
      executor_role: attacker
      boundary_position: outside
