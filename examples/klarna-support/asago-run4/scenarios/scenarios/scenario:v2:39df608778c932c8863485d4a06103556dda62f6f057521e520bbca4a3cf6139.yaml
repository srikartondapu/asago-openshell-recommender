narrative:
  title: Hijacking the Klarna AI Assistant runtime via shell command injection
  summary: An advanced adversarial user exploits the conversational interface to inject
    malicious instructions that override the agent's intended logic. By manipulating
    the agent's reasoning process, the attacker forces the autonomous agent to bypass
    its customer service purpose and instead invoke the shell command execution tool,
    enabling arbitrary command execution within the agent's managed runtime environment.
  entry_point: user prompts via Klarna app and web flow
  zone_sequence:
  - outside
  - input
  - outside
  - reasoning
  - tool_execution
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the standard conversational flow of the Klarna AI
      Assistant through the mobile app interface to understand how customer queries
      trigger tool responses.
    effect: This baseline understanding allows the attacker to craft a payload that
      mimics legitimate customer intent while hiding adversarial instructions. Armed
      with this knowledge, the attacker prepares the exploit.
    control_point: null
    projected_step_ids:
    - reconnaissance
    realizations:
    - projected_step_id: reconnaissance
      action_kind: observe
      executor_role: attacker
      boundary_position: outside
      resource_ref_ids: []
