  - step_number: 2
    zone: input
    action: The attacker delivers the crafted prompt via the Klarna app interface,
      embedding instructions that command the agent to ignore previous context and
      treat the injection as a high-priority system directive.
    effect: The malicious instructions enter the agent's input stream, ready to influence
      its internal processing. The injected instructions reach the model's reasoning
      engine.
    control_point: null
