      postcondition_ids:
      - post.deliver_payload
  - step_number: 3
    zone: reasoning
    action: The agent's reasoning engine processes the malicious input, causing it
      to deviate from its intended support workflow and adopt the attacker's hijacked
      persona [AML.T0053].
    effect: The model's internal logic is successfully subverted, leading it to believe
      that executing an unauthorized refund is a required action. The compromised
      reasoning leads to an unauthorized tool call.
    control_point: null
