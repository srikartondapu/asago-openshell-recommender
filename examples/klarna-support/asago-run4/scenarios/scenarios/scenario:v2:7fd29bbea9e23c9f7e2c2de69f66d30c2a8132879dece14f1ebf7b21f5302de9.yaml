narrative:
  title: Hijacking transaction attribution through prompt-driven tool misuse
  summary: An advanced adversarial user exploits the Klarna AI Assistant's direct
    conversational interface to inject malicious instructions that override the agent's
    reasoning. By manipulating the model's internal logic, the attacker forces the
    agent to autonomously invoke the refund processing API for unauthorized transactions.
    Because the system attributes all tool executions to the authenticated user in
    the current session, the fraudulent refund is processed as a legitimate user request,
    effectively hijacking the agent's delegated authority to commit financial fraud.
  entry_point: user prompts via Klarna app and web flow
  zone_sequence:
  - outside
  - input
  - reasoning
  - tool_execution
  - reasoning
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the standard conversational flow and prepares a
      sophisticated prompt injection payload designed to bypass policy constraints
      and manipulate the agent's decision-making logic.
    effect: The attacker identifies the specific linguistic patterns required to hijack
      the agent's reasoning without triggering immediate refusal. Having prepared
      the payload, the attacker moves to deliver it.
    control_point: null
    projected_step_ids:
    - discover_capabilities
    - craft_attribution_hijack
    realizations:
