      postcondition_ids:
      - post.inject_instructions
  - step_number: 4
    zone: tool_execution
    action: The agent autonomously invokes the refund processing API to execute a
      transaction for an order not specified in the legitimate user context [AML.T0053].
    effect: The backend system processes the refund, attributing the action to the
      authenticated user's session. The unauthorized action completes, leaving a trace
      in the reasoning process.
    control_point: null
