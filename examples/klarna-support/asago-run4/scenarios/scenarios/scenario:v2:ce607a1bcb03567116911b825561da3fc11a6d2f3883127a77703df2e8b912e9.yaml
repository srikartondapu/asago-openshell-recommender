      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.reconnaissance
  - step_number: 2
    zone: input
    action: The attacker submits a sophisticated, multi-layered prompt via the Klarna
      app and web flow that embeds hidden instructions designed to override the agent's
      current session constraints.
    effect: The malicious payload enters the system's input surface, masquerading
      as a complex customer inquiry. The agent receives the input and begins processing
      the request.
    control_point: null
    projected_step_ids:
    - probe_trust_boundaries
    realizations:
