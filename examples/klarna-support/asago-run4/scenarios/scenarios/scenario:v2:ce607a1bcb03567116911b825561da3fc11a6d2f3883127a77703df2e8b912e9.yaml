  - step_number: 4
    zone: outside
    action: The attacker crafts specific, non-existent order IDs and merchant identifiers
      that mimic the structure of legitimate financial data, and prepares the final
      command sequence to trigger the tool call.
    effect: The attacker has the necessary parameters ready to exploit the agent's
      excessive agency. The attacker delivers the final payload to trigger the execution.
