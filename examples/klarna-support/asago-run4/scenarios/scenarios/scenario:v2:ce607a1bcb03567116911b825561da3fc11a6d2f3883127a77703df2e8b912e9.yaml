faceting:
  risk_card:
    risk_id: atlas-over-or-under-reliance
    risk_name: Over- or under-reliance
    risk_description: In AI-assisted decision-making tasks, reliance measures how
      much a person trusts (and potentially acts on) a model's output. Over-reliance
      occurs when a person puts too much trust in a model, accepting a model's output
      when the model's output is likely incorrect. Under-reliance is the opposite,
      where the person doesn't trust the model but should.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may accept convincing but incorrect generative AI outputs, such
      as hallucinations or inaccurate legal and tax advice, as factual truth.
    threat_source: Generative AI systems that produce factually incorrect, outdated,
      or non-compliant information.
    vulnerability: The tendency of users to trust convincing-sounding AI responses
      without performing the required manual verification of fact-based queries.
    consequence: The implementation of inaccurate IT instructions, distorted statistics,
      or erroneous legal/accounting guidance within company operations.
    impact: Severe organizational harm including data loss, system damage, regulatory
      non-compliance, and reputational or financial damage to the company.
