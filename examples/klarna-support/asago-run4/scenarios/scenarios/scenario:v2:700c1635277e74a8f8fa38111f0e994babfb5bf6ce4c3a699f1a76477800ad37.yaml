narrative:
  title: Deceiving human reviewers through formatted output manipulation
  summary: An advanced adversarial user exploits the Klarna AI Assistant's escalation
    mechanism to commit unauthorized financial fraud. By injecting carefully crafted
    instructions via the chat interface, the attacker forces the assistant to generate
    deceptive, highly formatted text that obscures the true value of a refund request.
    When the conversation is escalated to a human agent, the manipulated output presents
    a misleading decision context, tricking the reviewer into approving a high-value
    transaction that appears benign in the agent's summary.
  entry_point: user prompts via Klarna app and web flow
  zone_sequence:
  - outside
  - input
  - reasoning
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the standard interaction flow and identifies that
      complex financial requests trigger human agent escalation, then prepares a sophisticated
      prompt designed to manipulate the assistant's subsequent output formatting [AML.T0067].
    effect: The attacker establishes the necessary context to exploit the human-in-the-loop
      oversight process. Having prepared the payload, the attacker initiates the attack.
    control_point: null
    projected_step_ids:
    - discover_oversight_structure
    - probe_agent_mechanisms
    - identify_presentation_patterns
    - craft_misleading_context
    - obfuscate_malicious_content
